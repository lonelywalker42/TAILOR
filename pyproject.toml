[project]
name = "tailor"
version = "0.1.0"
description = "Tail-sitter Analysis, Identification, Log & Optimization Resource — PX4 flight log analysis and PID tuning platform"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "TAILOR Team"},
]
keywords = ["px4", "flight-log", "system-identification", "pid-tuning", "tail-sitter"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    # GUI
    "PySide6>=6.6",
    "pyqtgraph>=0.13",
    # Logging & parsing
    "pyulog>=1.0",
    # Data & numerics
    "numpy>=1.26",
    "scipy>=1.12",
    "pandas>=2.2",
    # Database
    "SQLAlchemy>=2.0",
    # Control & identification
    "control>=0.10",
    "SIPPY>=1.4",
    # Optimization
    # "pygmo>=2.19",  # optional, heavy dependency
    # Report generation
    "Jinja2>=3.1",
    # 3D visualization
    "PyOpenGL>=3.1",
]

[project.optional-dependencies]
pdf = ["WeasyPrint>=61"]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]
build = [
    "pyinstaller>=6.0",
    "nuitka>=2.0",
]

[project.scripts]
tailor = "tailor.main:main"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools.packages.find]
include = ["tailor*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
